<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS Domain Converter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #444; }
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #1a73e8; outline: none; }
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            justify-content: center;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.3s;
        }
        .btn-convert { background-color: #1a73e8; color: white; }
        .btn-copy { background-color: #34a853; color: white; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .info {
            background: #e8f0fe;
            padding: 15px;
            border-left: 5px solid #1a73e8;
            border-radius: 4px;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>VLESS Domain Converter</h2>
    
    <div class="info">
        <strong>Automatic Replacements Active:</strong><br>
        1. ilubbt3.linlin.codes ➔ <b>ilj3.mmcloudx.website</b><br>
        2. aarielt1.linlin.codes <em>OR</em> kklj1.mmcloudx.website ➔ <b>bbilu1.joybaby.space</b>
    </div>

    <div class="grid">
        <div>
            <label>Paste Old Configs Here:</label>
            <textarea id="inputArea" placeholder="Paste your vless:// links here..."></textarea>
        </div>

        <div class="controls">
            <button class="btn-convert" onclick="convertConfigs()">Convert Configs</button>
            <button class="btn-copy" onclick="copyResult()">Copy Results</button>
        </div>

        <div>
            <label>New Configs (Updated Host & SNI):</label>
            <textarea id="outputArea" readonly placeholder="Result will appear here..."></textarea>
        </div>
    </div>
</div>

<script>
    function convertConfigs() {
        const input = document.getElementById('inputArea').value;
        if (!input.trim()) {
            alert("Please paste configs first.");
            return;
        }
        
        // Replacement Rules
        let result = input
            // Server 1 Rule
            .replace(/ilubbt3\.linlin\.codes/g, 'ilj3.mmcloudx.website')
            // Server 2 Rule (Catches both the original and the intermediate domain)
            .replace(/(aarielt1\.linlin\.codes|kklj1\.mmcloudx\.website)/g, 'bbilu1.joybaby.space');

        document.getElementById('outputArea').value = result;
    }

    function copyResult() {
        const output = document.getElementById('outputArea');
        if (!output.value) {
            alert("Nothing to copy!");
            return;
        }
        output.select();
        document.execCommand('copy');
        alert("Copied to clipboard!");
    }
</script>

</body>
</html>
