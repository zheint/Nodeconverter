<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS Node Converter (မြန်မာ)</title>
    <style>
        body {
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
            line-height: 1.6;
            direction: ltr;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #444; }
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #1a73e8; outline: none; }
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            justify-content: center;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.3s;
        }
        .btn-convert { background-color: #1a73e8; color: white; }
        .btn-copy { background-color: #34a853; color: white; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .info {
            background: #fff4e5;
            padding: 15px;
            border-left: 5px solid #ffa000;
            border-radius: 4px;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .info b { color: #d32f2f; }
    </style>
</head>
<body>

<div class="container">
    <h2>VLESS Domain ပြောင်းပေးသည့်ကိရိယာ</h2>
    
    <div class="info">
        <strong>အလိုအလျောက် ပြောင်းလဲပေးမည့် Host များ -</strong><br>
        • ilubbt3.linlin.codes ➔ <b>ilj3.mmcloudx.website</b><br>
        • aarielt1.linlin.codes ➔ <b>kklj1.mmcloudx.website</b>
    </div>

    <div class="grid">
        <div>
            <label>ယခင် Config အဟောင်းများကို ဤနေရာတွင် ထည့်ပါ -</label>
            <textarea id="inputArea" placeholder="vless:// လင့်ခ်များကို ဤနေရာတွင် paste လုပ်ပါ..."></textarea>
        </div>

        <div class="controls">
            <button class="btn-convert" onclick="convertConfigs()">ပြောင်းမည်</button>
            <button class="btn-copy" onclick="copyResult()">Copy ကူးမည်</button>
        </div>

        <div>
            <label>အသစ် ပြောင်းလဲပြီးသား Config များ -</label>
            <textarea id="outputArea" readonly placeholder="ရလဒ်ကို ဤနေရာတွင် ပြပေးပါမည်..."></textarea>
        </div>
    </div>
</div>

<script>
    function convertConfigs() {
        const input = document.getElementById('inputArea').value;
        if (!input.trim()) {
            alert("ကျေးဇူးပြု၍ config များ အရင်ထည့်ပါ။");
            return;
        }
        
        // Replacement Rules
        let result = input
            // Server 1
            .replace(/ilubbt3\.linlin\.codes/g, 'ilj3.mmcloudx.website')
            // Server 2
            .replace(/aarielt1\.linlin\.codes/g, 'kklj1.mmcloudx.website');

        document.getElementById('outputArea').value = result;
    }

    function copyResult() {
        const output = document.getElementById('outputArea');
        if (!output.value) {
            alert("Copy ကူးရန် ရလဒ်မရှိသေးပါ။");
            return;
        }
        output.select();
        document.execCommand('copy');
        alert("Copy ကူးပြီးပါပြီ။");
    }
</script>

</body>
</html>
